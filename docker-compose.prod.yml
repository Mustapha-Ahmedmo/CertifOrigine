version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "5001:5001"
    environment:
      - JWT_SECRET=your_jwt_secret
      - POSTGRES_USER=exampleuser
      - POSTGRES_PASSWORD=exampleuserpassword
      - POSTGRES_DB=djiboutiport
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # ✅ reCAPTCHA secret côté BACKEND uniquement
      - RECAPTCHA_SECRET_KEY=6Lf6fe0rAAAAPO2iRDmGFicuFRlLq73u0abb2aQ
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - ./backend/data:/usr/src/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # ✅ API URL injectée AU BUILD (Vite)
        VITE_API_URL: "http://146.59.239.14/api"
        # ✅ SITE KEY (publique) = "ID" reCAPTCHA
        VITE_RECAPTCHA_SITE_KEY: "6Lf6fe0rAAAAAGucifG6K-ynP2H8lJGSwY_I2zfM"
    networks:
      - app-network
    # On garde ton comportement actuel: build et écriture du dist sur l'hôte
    volumes:
      - ./frontend/dist:/app/dist
    command: ["npm", "run", "build"]

  nginx:
    image: nginx:alpine
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  db:
    image: postgres:16.4
    container_name: postgres-container
    environment:
      POSTGRES_USER: exampleuser
      POSTGRES_PASSWORD: exampleuserpassword
      POSTGRES_DB: djiboutiport
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
